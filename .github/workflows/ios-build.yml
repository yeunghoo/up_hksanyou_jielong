name: iOS Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install CocoaPods dependencies
        working-directory: jsb-link/frameworks/runtime-src/proj.ios_mac
        run: pod install

      - name: Build archive (unsigned - configure signing secrets in repo settings)
        working-directory: jsb-link/frameworks/runtime-src/proj.ios_mac
        run: |
          xcodebuild -workspace Solitaire.xcworkspace \
            -scheme Solitaire-mobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
