name: iOS Upload IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag that contains the IPA'
        required: true
        default: 'ipa-1.3.7'

env:
  TEAM_ID: ZQ83BTV27F
  BUNDLE_ID: solitaire.puzzle.barain.hongkongsanyou

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Download IPA from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.ipa" \
            --dir "$RUNNER_TEMP/ipa"
          ls -lh "$RUNNER_TEMP/ipa"

      - name: Verify IPA metadata
        run: |
          IPA=$(ls "$RUNNER_TEMP/ipa"/*.ipa | head -1)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          APP_PLIST=$(unzip -l "$IPA" | awk '/Payload\/.*\.app\/Info\.plist$/ {print $4; exit}')
          unzip -p "$IPA" "$APP_PLIST" | plutil -p - | \
            grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion|UIRequiredDeviceCapabilities" -A2

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app --type ios \
            -f "$IPA" \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"
