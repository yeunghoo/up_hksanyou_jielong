name: iOS Release (Archive + Upload)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.3.2)'
        required: true
        default: '1.3.2'
      build_number:
        description: 'Build number (CFBundleVersion)'
        required: false
        default: ''

env:
  TEAM_ID: ZQ83BTV27F
  BUNDLE_ID: solitaire.puzzle.barain.hongkongsanyou
  SCHEME: Solitaire-mobile
  PROJECT_DIR: jsb-link/frameworks/runtime-src/proj.ios_mac
  PROVISIONING_PROFILE_NAME: Solitaire2022_2027

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build number
        id: version
        run: |
          BUILD="${{ inputs.build_number }}"
          if [ -z "$BUILD" ]; then
            BUILD="${{ inputs.version }}"
          fi
          echo "marketing=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Update Info.plist version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          PLIST="ios/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.marketing }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build }}" "$PLIST"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "Build:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pod install

      - name: Import signing certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -A
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          ARCHIVE_PATH="$PWD/build/Solitaire.xcarchive"
          rm -rf build
          mkdir -p build

          xcodebuild -workspace Solitaire.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            archive

      - name: Export IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Solitaire.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist

          ls -lh build/export/

      - name: Verify IPA metadata
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          IPA="build/export/Solitaire-mobile.ipa"
          APP_PLIST=$(unzip -l "$IPA" | awk '/Payload\/.*\.app\/Info\.plist$/ {print $4; exit}')
          unzip -p "$IPA" "$APP_PLIST" | plutil -p - | \
            grep -E "CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion|UIRequiredDeviceCapabilities" -A2

      - name: Upload to App Store Connect
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app --type ios \
            -f "build/export/Solitaire-mobile.ipa" \
            -u "$APPLE_ID" \
            -p "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solitaire-mobile-${{ steps.version.outputs.marketing }}
          path: jsb-link/frameworks/runtime-src/proj.ios_mac/build/export/Solitaire-mobile.ipa
          retention-days: 14
